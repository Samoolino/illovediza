name: Spain geospatial ingestion

on:
  push:
    paths:
      - '.github/workflows/spain-geospatial-ingestion.yml'
      - 'scripts/fetch-spain-ign-boundaries.mjs'
      - 'scripts/fetch-spain-sports-candidates.mjs'
      - 'src/spain-ign-ingestion.mjs'
      - 'src/osm-sports-import.mjs'
      - 'src/spain-spatial-join.mjs'
      - 'tests/spain-spatial-join.test.mjs'
      - 'tests/spain-ign-ingestion.test.mjs'
      - 'package.json'
      - 'scripts/crosswalk-spain-venues-to-ign.mjs'
      - 'data/spain/venue-discovery/spain-sports-overpass.ql'
  workflow_dispatch:
    inputs:
      boundary_release:
        description: "IGN/CNIG boundary release date verified from the current catalogue (YYYY-MM-DD)"
        required: true
        default: "2026-08-18"
        type: string
      run_ign:
        description: "Fetch and structurally validate official IGN municipal polygons"
        required: true
        default: true
        type: boolean
      run_osm:
        description: "Fetch current OSM padel, tennis and football-stadium candidates"
        required: true
        default: true
        type: boolean
      page_size:
        description: "IGN OGC API page size"
        required: true
        default: "1000"
        type: string

concurrency:
  group: spain-geospatial-ingestion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUN_IGN: ${{ github.event_name == 'push' || inputs.run_ign }}
  RUN_OSM: ${{ github.event_name == 'push' || inputs.run_osm }}
  BOUNDARY_RELEASE: ${{ inputs.boundary_release || '2026-08-18' }}
  PAGE_SIZE: ${{ inputs.page_size || '1000' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Illovediza
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run project tests
        run: npm test
      - name: Fetch IGN municipal geometry
        if: env.RUN_IGN == 'true'
        run: npm run fetch:spain:ign -- --boundary-release "${BOUNDARY_RELEASE}" --page-size "${PAGE_SIZE}"
      - name: Fetch OSM sports candidates
        if: always() && env.RUN_OSM == 'true'
        run: npm run discover:sports:spain
      - name: Crosswalk OSM candidates to official IGN municipality polygons
        if: always() && env.RUN_IGN == 'true' && env.RUN_OSM == 'true'
        run: |
          if [ -f .cache/spain/ign/spain-municipalities.geojson ] && [ -f .cache/spain/venues/sports-venue-candidates.json ]; then
            npm run crosswalk:spain:venues
          else
            echo 'IGN geometry or OSM candidates are missing; spatial crosswalk was not run.'
          fi
      - name: Upload source snapshots and QA manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illovediza-spain-geospatial-${{ github.run_id }}
          path: |
            .cache/spain/ign/
            .cache/spain/venues/
          if-no-files-found: warn
          retention-days: 90
