name: Spain geospatial ingestion

on:
  workflow_dispatch:
    inputs:
      boundary_release:
        description: "IGN/CNIG boundary release date verified from the current catalogue (YYYY-MM-DD)"
        required: true
        default: "2026-08-18"
        type: string
      run_ign:
        description: "Fetch and structurally validate official IGN municipal polygons"
        required: true
        default: true
        type: boolean
      run_osm:
        description: "Fetch current OSM padel, tennis and football-stadium candidates"
        required: true
        default: true
        type: boolean
      page_size:
        description: "IGN OGC API page size"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Illovediza
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Fetch IGN municipal geometry
        if: inputs.run_ign
        run: npm run fetch:spain:ign -- --boundary-release "${{ inputs.boundary_release }}" --page-size "${{ inputs.page_size }}"
      - name: Fetch OSM sports candidates
        if: inputs.run_osm
        run: npm run discover:sports:spain
      - name: Upload source snapshots and QA manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illovediza-spain-geospatial-${{ github.run_id }}
          path: |
            .cache/spain/ign/
            .cache/spain/venues/
          if-no-files-found: warn
          retention-days: 30
